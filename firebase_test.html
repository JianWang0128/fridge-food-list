<!DOCTYPE html>
<html>

<head>
    <title>Firebase Test</title>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCSSST-Zw2C8D7tywZL_W9BcoR-fy-OTpA",
            authDomain: "fridge-food-list.firebaseapp.com",
            projectId: "fridge-food-list",
            storageBucket: "fridge-food-list.firebasestorage.app",
            messagingSenderId: "954407963626",
            appId: "1:954407963626:web:868304497d36ce19bd8093",
            measurementId: "G-N2P9LMEY0W"
        };

        console.log("Starting Firebase test...");

        try {
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            console.log("Firebase initialized successfully");

            // Listen for authentication state changes
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    console.log("User is signed in:", user.email);
                    document.getElementById('status').innerText = `User signed in: ${user.email}`;
                } else {
                    console.log("User is signed out");
                    document.getElementById('status').innerText = "User is signed out";
                }
            });

            document.getElementById('status').innerText = "Firebase connected successfully";

        } catch (error) {
            console.error("Firebase initialization failed:", error);
            document.getElementById('status').innerText = `Firebase error: ${error.message}`;
        }
    </script>
</head>

<body>
    <h1>Firebase Connection Test</h1>
    <p id="status">Initializing Firebase...</p>
    <p>Check browser console for detailed logs.</p>
</body>

</html>
